# 로컬 학습용 PostgreSQL. 비밀번호는 로컬 전용 가짜 값이다.
#
# [내 PC] Docker ─▶ PostgreSQL 컨테이너 (포트 5433)
#                     ▲ postgresql://app:app@localhost:5433/midproject
#         FastAPI 앱 ─┘ SQLAlchemy + psycopg
#
# 첫 기동(빈 볼륨) 때 db/init 의 파일을 이름 순서로 한 번만 실행한다.
#   01_test_db.sql  테스트 전용 DB midproject_test 만들기 (표는 테스트가 직접 만듦)
#   02_schema.sh    기획서 스키마 ../docs/sql/00~07 (표 60개 + 보기 1개)을 midproject 에 만들기
# 데이터는 넣지 않는다(표만 생김). 더미 데이터는 ../data/dummy 에서 따로 넣는다.
#
#   docker compose up -d --wait     # 띄우기 (healthy = 스키마까지 다 만들어짐)
#   docker compose down -v          # 볼륨까지 지우기 — ../docs/sql 을 고친 뒤 다시 만들 때
#   docker compose exec postgres psql -U app -d midproject
services:
  postgres:
    image: pgvector/pgvector:pg17   # postgres:17 + pgvector 확장 (챗봇 RAG 벡터 저장, scripts/rag_ingest.py)
    container_name: midproject-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: midproject
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    # 이 PC 에는 PostgreSQL 17 서비스가 이미 5432 를 쓰고 있어서 5433 으로 연다.
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ../docs/sql:/schema:ro          # 기획서 스키마 (02_schema.sh 가 읽음)
    healthcheck:
      # -h 127.0.0.1: 첫 기동 때 init 파일을 실행하는 임시 서버는 TCP 를 열지 않으므로
      # 스키마 생성이 끝나고 진짜 서버가 뜬 뒤에야 healthy 가 된다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d midproject"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
